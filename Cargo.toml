[package]
name = "rust-nn"
version = "0.4.0"
edition = "2021"
description = "A small PyTorch-like neural network engine in Rust (autograd + CNN + Transformer)"
license = "MIT"

[lib]
name = "rustnn"

[dependencies]
rayon = "1.10"
matrixmultiply = "0.3"

# CUDA: loaded at runtime (dynamic-loading), so it builds without the CUDA toolkit
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "cublas", "dynamic-loading", "cuda-12080"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-metal-performance-shaders = { version = "0.3", optional = true }

[features]
default = []
# GPU backends: Apple Metal (mps) and NVIDIA (cuda)
cuda = ["dep:cudarc"]
mps = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal", "dep:objc2-metal-performance-shaders"]
# Use Apple Accelerate (AMX) for CPU matmul on macOS
accelerate = []

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
