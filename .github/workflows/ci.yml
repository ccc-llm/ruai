name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pretrained:
        description: "Also download GPT-2 (~550 MB) and SmolLM2-135M (~270 MB) and test against the real weights"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (CPU, CUDA build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # gymnasium, numpy, scikit-learn, matplotlib: tests/world.rs and tests/py0 compare against them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install gymnasium numpy scikit-learn matplotlib
      # torch (CPU build): tests/py0/torch compares py0's torch package with it
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      # py0 → WebAssembly (WasmGC) runs on Node.js: tests/py0.rs compares it with CPython
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cargo test --release
      # the py0 → wasm compiler itself builds for browsers (py0/web)
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --release --example py0_wasm --target wasm32-unknown-unknown --no-default-features --features py
      # py0 → a Python extension module (PyO3), compared with CPython
      - run: sh tests/py0/pyo3/run.sh
        env:
          PY2RS_PYTHON: python
      - run: cargo clippy --all-targets
      # every part is a feature: the crate must also build with none of them
      - run: cargo check --lib --no-default-features
      - run: cargo check --no-default-features --features world
      - run: cargo check --no-default-features --features pyrt
      - run: cargo check --no-default-features --features py
      - run: cargo check --no-default-features --features agent
      - run: cargo check --no-default-features --features pyrt-python
      # CUDA libraries are loaded at runtime, so the backend builds without a GPU
      - run: cargo check --all-targets --features cuda
      - run: cargo clippy --all-targets --features cuda
      - run: cargo doc --no-deps --features cuda
        env:
          RUSTDOCFLAGS: -D warnings

  macos:
    name: macOS (CPU + Accelerate, Metal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install gymnasium numpy scikit-learn matplotlib
      # GPU tests in tests/devices.rs run only if the runner exposes a Metal device
      - run: cargo test --release --features mps,accelerate
      - run: cargo clippy --all-targets --features mps,accelerate
      - run: cargo doc --no-deps --features mps
        env:
          RUSTDOCFLAGS: -D warnings

  pretrained:
    name: Pretrained models (real weights)
    if: github.event_name == 'workflow_dispatch' && inputs.pretrained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/download_gpt2.sh
      - run: ./scripts/download_smollm.sh
      - run: cargo test --release --test inference --test tokenizer --test llama -- --nocapture
