name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pretrained:
        description: "Also download GPT-2 (~550 MB) and SmolLM2-135M (~270 MB) and test against the real weights"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (CPU, CUDA build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # gymnasium, numpy: tests/world.rs compares the environments with them
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install gymnasium numpy
      - run: cargo test --release
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --all-targets
      # every part is a feature: the crate must also build with none of them
      - run: cargo check --lib --no-default-features
      - run: cargo check --no-default-features --features world
      - run: cargo check --no-default-features --features plot
      # WebGPU: builds natively (Vulkan; no GPU on the runner) and for browsers
      - run: cargo clippy --all-targets --features webgpu
      - run: cargo check --lib --target wasm32-unknown-unknown --no-default-features --features webgpu
      # the browser demo (wasm-bindgen's JS glue is generated by build.sh, not here)
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path examples/webgpu-browser/Cargo.toml
      # CUDA libraries are loaded at runtime, so the backend builds without a GPU
      - run: cargo check --all-targets --features cuda
      - run: cargo clippy --all-targets --features cuda
      - run: cargo doc --no-deps --features cuda
        env:
          RUSTDOCFLAGS: -D warnings

  macos:
    name: macOS (CPU + Accelerate, Metal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install gymnasium numpy
      # GPU tests in tests/devices.rs run only if the runner exposes a Metal device
      - run: cargo test --release --features mps,accelerate
      - run: cargo test --release --features webgpu --test devices
      - run: cargo clippy --all-targets --features mps,accelerate
      - run: cargo doc --no-deps --features mps
        env:
          RUSTDOCFLAGS: -D warnings

  pretrained:
    name: Pretrained models (real weights)
    if: github.event_name == 'workflow_dispatch' && inputs.pretrained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/download_gpt2.sh
      - run: ./scripts/download_smollm.sh
      - run: cargo test --release --test inference --test tokenizer --test llama -- --nocapture
