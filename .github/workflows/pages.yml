name: Pages

# Build the website (site/: ruai's demos, and rupy's IDE and notebook, all
# compiled to WebAssembly) and publish it on GitHub Pages. rupy is checked out
# next to ruai (../rupy), where site/build.mjs looks for it.
# In the repository's settings, Pages → Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "Cargo.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ruai
      - uses: actions/checkout@v5
        with:
          repository: ccc-claude-opus/rupy
          path: rupy
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ruai
            ruai/site/wasm
            rupy
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: ./run.sh build
        working-directory: ruai
      - run: ./run.sh test
        working-directory: ruai
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ruai/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
